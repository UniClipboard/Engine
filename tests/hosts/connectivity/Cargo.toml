[package]
name = "uc-connectivity-host"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false

# 旧版 Engine 公开接口按能力分层：当前源码启用全部能力；旧锚点只启用其 rev 已有的能力，
# 对应关系见 tests/upgrade-matrix/host-features.json。
[features]
# 入站故障控制单独启用，冻结 main 复用源码时仍可选择原 current-engine 能力集。
default = ["current-engine", "inbound-network-faults", "transfer-progress"]
# 冻结旧端仍复用 current-engine；新增进度API只能由新宿主单独启用。
transfer-progress = []
inbound-network-faults = ["current-engine"]
current-engine = [
  "automatic-sync-control",
  "connectivity-opportunity",
  "device-group-choices",
  "join-status",
  "network-recovery",
  "process-observability",
  "startup-progress",
  "test-network-config",
]
automatic-sync-control = []
connectivity-opportunity = []
device-group-choices = []
branch-recovery-tests = ["device-group-choices"]
# 旧版 Engine 不认识注入 feature；当前端测试命令同时显式启用 uc-engine 对应 feature。
branch-recovery-fault-tests = ["branch-recovery-tests"]
join-status = []
network-recovery = []
process-observability = []
startup-progress = []
test-network-config = []

[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
url = "2"
tokio = { version = "1", features = ["full"] }
uc-engine = { path = "../../../crates/uc-engine", features = ["dev-tools"] }

[dev-dependencies]
diesel = { version = "2.3.5", features = ["sqlite"] }
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true

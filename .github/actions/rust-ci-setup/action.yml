name: Rust CI setup
description: >-
  Installs the pinned toolchain and prepares the dependency cache, the compiler cache and full build
  parallelism shared by every Rust job.

inputs:
  cache-key:
    description: Rust dependency cache key shared by jobs that build the same set of targets.
    required: true
  fast-compile-infra:
    description: >-
      仅对允许名单中的 Infra crate 取消 Cargo.toml 优化覆盖，用于已验证不依赖该优化的覆盖率作业。
      存储 crate 保持项目定义的优化口径，原并发加密读写回归仍使用相同负载和期限。
    required: false
    default: "false"
  compile-cache-r2-endpoint:
    description: R2 S3 endpoint secret; empty selects the local MBX cache.
    required: false
    default: ""
  compile-cache-r2-access-key-id:
    description: R2 S3 access key id secret; empty selects the local MBX cache.
    required: false
    default: ""
  compile-cache-r2-secret-access-key:
    description: R2 S3 secret access key secret; empty selects the local MBX cache.
    required: false
    default: ""
  dependency-cache:
    description: Cache Cargo downloads only; never restore target or live MBX directories.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup show active-toolchain

    - name: Start MBX compiler cache
      shell: bash
      run: bash scripts/build-cache/start-ci-mbx.sh

    - name: Restore compressed MBX snapshot
      uses: ./.github/actions/mbx-snapshot
      with:
        scene: ${{ inputs.cache-key }}
        endpoint: ${{ inputs.compile-cache-r2-endpoint }}
        access-key-id: ${{ inputs.compile-cache-r2-access-key-id }}
        secret-access-key: ${{ inputs.compile-cache-r2-secret-access-key }}

    # 只缓存 Cargo 下载；MBX 必须经导出闭包归档，禁止转储 live cache 或 target。
    - name: Cache Cargo downloads
      if: inputs.dependency-cache == 'true'
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        workspaces: . -> target
        shared-key: mbx-${{ inputs.cache-key }}
        cache-targets: 'false'

    # 显式提供构建来源后，uc-observability-runtime 的 build script 不再跟踪 git 与源码目录的修改时间；
    # 否则同一 job 内每次 cargo 调用都可能重跑它，并连锁重编 uc-infra-profile、uc-engine 与全部宿主。
    - name: Record build provenance
      shell: bash
      run: |
        state=clean
        if [[ -n "$(git status --porcelain)" ]]; then state=modified; fi
        {
          echo "UC_ENGINE_SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "UC_ENGINE_SOURCE_STATE=$state"
        } >> "$GITHUB_ENV"

    # 已校验诊断栈的覆盖率作业仅对允许名单恢复 dev 默认值。
    # 存储沿用 Cargo.toml：未优化插桩会放大完整加密材料和索引维护的 CPU 成本，令原并发回归超时。
    # 保持原读写负载、时序门限和存储实现，只为其使用同一产品优化口径。
    - name: Compile uc-infra-* crates without the mobile optimization override
      if: inputs.fast-compile-infra == 'true'
      shell: bash
      run: |
        cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        mkdir -p "$cargo_home"
        for crate in local crypto security content p2p profile; do
          printf '\n[profile.dev.package.uc-infra-%s]\nopt-level = 0\n' "$crate" >> "$cargo_home/config.toml"
        done

name: Windows Build

# Windows 门禁：固定原生 MBX 入口复用统一只读缓存装配，不恢复整个 target。
# 构建证据（cargo check）与运行证据（Windows 专属存储测试）分步记录，
# arm64 只有在 windows-11-arm 主机上实际执行才记为通过。
on:
  workflow_dispatch:
  pull_request:
    branches: [main, migration/initial-core-import]
  merge_group:
  push:
    branches: [main, migration/initial-core-import]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup show active-toolchain

      - name: Start shared Engine compiler cache
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: windows-${{ matrix.arch }}
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Record build provenance
        run: |
          state=clean
          if [[ -n "$(git status --porcelain)" ]]; then state=modified; fi
          {
            echo "UC_ENGINE_SOURCE_COMMIT=$(git rev-parse HEAD)"
            echo "UC_ENGINE_SOURCE_STATE=$state"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/windows-evidence"
          {
            echo "source=$(git rev-parse HEAD)"
            echo "runner=${{ matrix.runner }} arch=${{ matrix.arch }}"
            rustc -vV
            cargo -V
          } | tee "$RUNNER_TEMP/windows-evidence/toolchain.txt"

      - name: Validate workspace metadata
        run: cargo metadata --locked --format-version 1 > /dev/null

      # 构建证据：编译全部工作区目标，包括 cfg(windows) 专属代码。
      - name: Check all workspace targets
        run: bash scripts/build-cache/mbx.sh --cargo check --workspace --all-targets --locked 2>&1 | tee "$RUNNER_TEMP/windows-evidence/check.log"

      # 运行证据：在 Windows 主机上真实执行 MoveFileExW 替换路径，只使用临时目录。
      - name: Run Windows storage durability tests
        run: |
          bash scripts/build-cache/mbx.sh --cargo test --locked -p uc-infra-storage --lib active_space_generation_manifest_store 2>&1 | tee "$RUNNER_TEMP/windows-evidence/storage-tests.log"
          bash scripts/build-cache/mbx.sh --cargo test --locked -p uc-infra-local --lib fs::atomic_publish 2>&1 | tee -a "$RUNNER_TEMP/windows-evidence/storage-tests.log"
          bash scripts/build-cache/mbx.sh --cargo test --locked -p uc-infra-local --lib fs::durability 2>&1 | tee -a "$RUNNER_TEMP/windows-evidence/storage-tests.log"

      - name: Publish scenario CAS snapshot
        if: success() && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: ./.github/actions/mbx-snapshot
        with:
          operation: save
          scene: windows-${{ matrix.arch }}
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Retain Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-build-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/windows-evidence
            ${{ runner.temp }}/mbx-evidence
          if-no-files-found: warn

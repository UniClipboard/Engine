name: Windows Storage Upgrade

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'crates/uc-infra/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/windows-storage-upgrade.yml'
      - 'scripts/diagnostics/windows_flush_probe.rs'

permissions:
  contents: read

concurrency:
  group: windows-storage-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-upgrade:
    name: Native Windows storage and recovery
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: windows-storage-upgrade
      - name: Verify native Windows flush semantics
        run: |
          rustc --edition 2021 scripts/diagnostics/windows_flush_probe.rs -o "$env:RUNNER_TEMP\windows-flush-probe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\windows-flush-probe.exe"
      - name: Test storage upgrade internals
        run: cargo test --locked -p uc-infra --lib security::profile_storage_upgrade -- --nocapture
      - name: Test filesystem durability
        run: cargo test --locked -p uc-infra --lib fs::durability -- --nocapture
      - name: Test control generation storage
        run: cargo test --locked -p uc-infra --lib security::space_control_generation -- --nocapture
      - name: Test upgrade and restart recovery
        run: cargo test --locked -p uc-infra --test profile_storage_upgrade -- --nocapture

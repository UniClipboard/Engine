name: Engine real environment

on:
  schedule:
    - cron: "30 2 * * *"
  # 锚点定义变化的 PR 运行一次升级兼容矩阵；其余 job 只响应定时与手动触发。
  pull_request:
    paths:
      - tests/upgrade-matrix/anchors.json
      - tests/upgrade-matrix/host-features.json
      - tests/upgrade-matrix/anchors/**
  workflow_dispatch:
    inputs:
      mode:
        description: Real network mode to run
        required: true
        default: direct
        type: choice
        options:
          - direct
          - known-peer
          - relay
          - legacy
          - lan-only
          - lan-only-vpn
          - profile-upgrade
          - membership-e2e
          - upgrade-matrix
      case_prefix:
        description: Optional single scenario prefix such as E01, E02, or E03
        required: false
        type: string
      repeat:
        description: Number of scenario repetitions
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read

concurrency:
  group: engine-real-environment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PR Check 的完整检查每种模式只跑一轮；nightly 负责三轮重复，暴露偶发的恢复失败。
  nightly:
    # 名称不引用矩阵变量：job 级 if 先于矩阵展开求值，被跳过时引用无法展开；运行时 GitHub 自动追加矩阵值。
    name: Nightly real Engine
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    # 编译缓存凭据：只有 main 上的可信运行绑定限定 main 分支的写入环境，其余运行（PR、合并队列、其他分支）用只读令牌；
    # fork 与 Dependabot 拿不到任何 secret，回退为按 ref 隔离的 GitHub Actions 缓存。
    # 本文件其余 Rust job 使用相同绑定；详见 docs/design-docs/decisions/029-ci-r2-compile-cache.md。
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, known-peer, relay, legacy, lan-only, lan-only-vpn]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install network test tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables wireguard-tools iputils-ping file clang libclang-dev cmake
      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: engine-real-environment-${{ matrix.mode }}
          compile-cache-access: ${{ github.ref == 'refs/heads/main' && 'write' || 'read' }}
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Build real Engine hosts
        id: build
        shell: bash
        run: |
          started_at=$(date +%s)
          cargo build -p uc-connectivity-host -p uc-connectivity-relay --locked
          echo "seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
      - name: Run real Engine scenario
        shell: bash
        run: |
          started_at=$(date +%s)
          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            bash scripts/testing/run-connection-recovery-e2e.sh \
            --suite network \
            --repeat 3 \
            --mode "${{ matrix.mode }}"
          result=$?
          set -e
          elapsed=$(( $(date +%s) - started_at ))
          {
            echo "## Real Engine nightly"
            echo "- mode: ${{ matrix.mode }}"
            echo "- repetitions: 3"
            echo "- compile wall time: ${{ steps.build.outputs.seconds }}s"
            echo "- scenario and cleanup wall time: ${elapsed}s"
            echo "- total measured wall time: $(( ${{ steps.build.outputs.seconds }} + elapsed ))s"
            echo "- result: $([ "$result" -eq 0 ] && echo passed || echo failed)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Retain real environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-real-environment-${{ matrix.mode }}
          path: target/connection-recovery-evidence
          if-no-files-found: warn
          retention-days: 14

  manual:
    name: Manual real Engine scenario
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'profile-upgrade' && inputs.mode != 'membership-e2e' && inputs.mode != 'upgrade-matrix'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install network test tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables wireguard-tools iputils-ping file clang libclang-dev cmake
      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: engine-real-environment-${{ inputs.mode }}
          compile-cache-access: ${{ github.ref == 'refs/heads/main' && 'write' || 'read' }}
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Build real Engine hosts
        id: build
        shell: bash
        run: |
          started_at=$(date +%s)
          cargo build -p uc-connectivity-host -p uc-connectivity-relay --locked
          echo "seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
      - name: Run selected real Engine scenario
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CASE_PREFIX: ${{ inputs.case_prefix }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          args=(--suite network --repeat "$REPEAT" --mode "$MODE")
          if [[ -n "$CASE_PREFIX" ]]; then
            args+=(--case "$CASE_PREFIX")
          fi
          started_at=$(date +%s)
          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            bash scripts/testing/run-connection-recovery-e2e.sh "${args[@]}"
          result=$?
          set -e
          elapsed=$(( $(date +%s) - started_at ))
          {
            echo "## Real Engine manual scenario"
            echo "- mode: $MODE"
            echo "- case: ${CASE_PREFIX:-all cases in mode}"
            echo "- repetitions: $REPEAT"
            echo "- compile wall time: ${{ steps.build.outputs.seconds }}s"
            echo "- scenario and cleanup wall time: ${elapsed}s"
            echo "- total measured wall time: $(( ${{ steps.build.outputs.seconds }} + elapsed ))s"
            echo "- result: $([ "$result" -eq 0 ] && echo passed || echo failed)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Retain real environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-real-environment-${{ inputs.mode }}-${{ github.run_attempt }}
          path: target/connection-recovery-evidence
          if-no-files-found: warn
          retention-days: 14

  profile-upgrade:
    name: Nightly profile upgrade evidence
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'profile-upgrade')
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: engine-real-environment-profile-upgrade
          compile-cache-access: ${{ github.ref == 'refs/heads/main' && 'write' || 'read' }}
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-nextest@0.9.145
      - name: Build profile upgrade tests
        id: build
        shell: bash
        run: |
          started_at=$(date +%s)
          cargo nextest run --profile ci --no-run -p uc-infra \
            --test profile_storage_upgrade \
            --test profile_storage_upgrade_crash
          echo "seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
      - name: Run profile upgrade evidence
        shell: bash
        run: |
          started_at=$(date +%s)
          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            cargo nextest run --profile ci -p uc-infra \
              --test profile_storage_upgrade \
              --test profile_storage_upgrade_crash
          result=$?
          set -e
          elapsed=$(( $(date +%s) - started_at ))
          {
            echo "## Profile upgrade nightly"
            echo "- coverage: synthetic profile migration and five process-exit recovery boundaries"
            echo "- alpha.5 external fixture: skipped"
            echo "- compile wall time: ${{ steps.build.outputs.seconds }}s"
            echo "- scenario and cleanup wall time: ${elapsed}s"
            echo "- total measured wall time: $(( ${{ steps.build.outputs.seconds }} + elapsed ))s"
            echo "- result: $([ "$result" -eq 0 ] && echo passed || echo failed)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Retain profile upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-profile-upgrade-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            target/test-artifacts/real-dependencies
          if-no-files-found: error
          retention-days: 14

  membership-e2e:
    name: Membership multi-device scenarios
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'membership-e2e')
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: engine-real-environment-membership-e2e
          compile-cache-access: ${{ github.ref == 'refs/heads/main' && 'write' || 'read' }}
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-nextest@0.9.145
      - name: Build membership scenarios
        id: build
        shell: bash
        run: |
          started_at=$(date +%s)
          cargo nextest run --profile ci --locked --no-run -p uc-engine --features dev-tools \
            --test space_membership_auto_pairing_e2e
          echo "seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
      - name: Run membership scenarios
        shell: bash
        env:
          UC_TEST_ARTIFACTS_DIR: target/test-artifacts/ci
        run: |
          started_at=$(date +%s)
          set +e
          bash scripts/testing/run-test-group.sh membership-e2e
          result=$?
          set -e
          elapsed=$(( $(date +%s) - started_at ))
          {
            echo "## Membership multi-device scenarios"
            echo "- compile wall time: ${{ steps.build.outputs.seconds }}s"
            echo "- scenario and cleanup wall time: ${elapsed}s"
            echo "- result: $([ "$result" -eq 0 ] && echo passed || echo failed)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Retain membership scenario evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-membership-e2e-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            target/test-artifacts/ci/membership-e2e
          if-no-files-found: error
          retention-days: 14

  # 升级兼容矩阵（各锚点到当前源码与 D1 完整链）：先按 rev 构建并缓存全部旧版宿主，再按维度分片运行，最后合并
  # 矩阵表。夜间、锚点定义变化的 PR 与手动触发运行同一矩阵。
  upgrade-anchors:
    name: Upgrade matrix anchor hosts
    if: github.event_name == 'schedule' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'upgrade-matrix')
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: engine-real-environment-upgrade-matrix
          compile-cache-access: ${{ github.ref == 'refs/heads/main' && 'write' || 'read' }}
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Cache anchor hosts
        uses: actions/cache@v4
        with:
          path: |
            target/upgrade-anchors/*/bin
            target/upgrade-anchors/*/host.json
          key: upgrade-anchors-${{ runner.os }}-${{ hashFiles('tests/upgrade-matrix/anchors.json', 'tests/upgrade-matrix/host-features.json', 'tests/upgrade-matrix/anchors/**', 'tests/hosts/connectivity/**', 'scripts/testing/build-upgrade-anchors.sh') }}
          restore-keys: upgrade-anchors-${{ runner.os }}-
      - name: Build anchor hosts
        shell: bash
        run: |
          started_at=$(date +%s)
          bash scripts/testing/build-upgrade-anchors.sh --all
          echo "- anchor host build wall time: $(( $(date +%s) - started_at ))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain anchor build records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-upgrade-anchors-${{ github.run_attempt }}
          path: |
            target/upgrade-anchors/*/host.json
            target/upgrade-anchors/*/build.log
          if-no-files-found: warn
          retention-days: 14

  upgrade-matrix:
    name: Upgrade matrix (${{ matrix.dimension }})
    needs: upgrade-anchors
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        dimension: [d1, d2, d3, d4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: engine-real-environment-upgrade-matrix
          compile-cache-access: ${{ github.ref == 'refs/heads/main' && 'write' || 'read' }}
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Cache anchor hosts
        uses: actions/cache@v4
        with:
          path: |
            target/upgrade-anchors/*/bin
            target/upgrade-anchors/*/host.json
          key: upgrade-anchors-${{ runner.os }}-${{ hashFiles('tests/upgrade-matrix/anchors.json', 'tests/upgrade-matrix/host-features.json', 'tests/upgrade-matrix/anchors/**', 'tests/hosts/connectivity/**', 'scripts/testing/build-upgrade-anchors.sh') }}
          restore-keys: upgrade-anchors-${{ runner.os }}-
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-nextest@0.9.145
      - name: Run matrix shard
        shell: bash
        env:
          UC_TEST_ARTIFACTS_DIR: target/test-artifacts/ci
        run: |
          started_at=$(date +%s)
          set +e
          bash scripts/testing/run-test-group.sh upgrade-matrix --dimension ${{ matrix.dimension }}
          result=$?
          set -e
          echo "- ${{ matrix.dimension }} wall time: $(( $(date +%s) - started_at ))s, result $result" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Retain matrix shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-upgrade-matrix-${{ matrix.dimension }}-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            target/test-artifacts/ci/upgrade-matrix
          if-no-files-found: error
          retention-days: 14

  upgrade-matrix-report:
    name: Upgrade matrix report
    needs: upgrade-matrix
    if: always() && needs.upgrade-matrix.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download matrix shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: engine-upgrade-matrix-d*-${{ github.run_attempt }}
          path: target/upgrade-matrix-shards
      - name: Summarize matrix
        shell: bash
        run: |
          mkdir -p target/upgrade-matrix-report
          set +e
          node scripts/testing/summarize-upgrade-matrix.mjs target/upgrade-matrix-report target/upgrade-matrix-shards
          result=$?
          set -e
          cat target/upgrade-matrix-report/matrix.md >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Retain matrix report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-upgrade-matrix-report-${{ github.run_attempt }}
          path: target/upgrade-matrix-report
          if-no-files-found: error
          retention-days: 30

name: Mobile compiler cache validation
# 从真实 Mobile 调用链生成固定 Engine pin 的原生产物，不发布、不启动应用。
on:
  workflow_dispatch:
    inputs:
      mobile_ref:
        description: Immutable Mobile candidate commit
        type: string
        default: '5289c4aff8e8953a1561fdb925218901097bec1b'
  push:
    branches: [ci/windows-mbx-entry]
    paths: [.github/workflows/mobile-cache-validation.yml]
permissions:
  contents: read
jobs:
  native-artifacts:
    runs-on: macos-15
    timeout-minutes: 90
    environment:
      name: engine-build-cache-reader
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      MBX_GC_MAX_SIZE: 2GiB
      UC_ENGINE_MBX_LOCAL_ONLY: "1"
      MBX_REMOTE_URL: ''
      MBX_REMOTE_NAMESPACE: ''
      MBX_REMOTE_S3_ENDPOINT: ''
      MBX_REMOTE_S3_REGION: ''
      MBX_REMOTE_TOKEN: ''
      MBX_REMOTE_TOKEN_FILE: ''
      MBX_REMOTE_OIDC_AUDIENCE: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: mobile
          repository: UniClipboard/UniClip
          ref: ${{ inputs.mobile_ref || '5289c4aff8e8953a1561fdb925218901097bec1b' }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: mobile/.nvmrc
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Isolate build resources
        run: |
          echo "MBX_CACHE_DIR=$RUNNER_TEMP/mobile-cas" >> "$GITHUB_ENV"
          echo "UC_ENGINE_LOCAL_TARGET_DIR=$RUNNER_TEMP/mobile-target" >> "$GITHUB_ENV"
          echo "UC_ENGINE_MBX_STATS_DIR=$RUNNER_TEMP/mbx-evidence" >> "$GITHUB_ENV"
          echo "UC_TOOLS_DIR=$RUNNER_TEMP/cache-tools" >> "$GITHUB_ENV"
      - name: Record immutable source and empty output roots
        working-directory: mobile
        run: |
          test ! -e "$MBX_CACHE_DIR"
          test ! -e "$UC_ENGINE_LOCAL_TARGET_DIR"
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/mobile-source.txt"
          echo "UC_MBX_SNAPSHOT_VARIANT=$(node -p 'require("./modules/uc-engine/core-source.json").sourceCommit')" >> "$GITHUB_ENV"
          cp modules/uc-engine/core-source.json "$RUNNER_TEMP/evidence/engine-source.json"
          uname -a > "$RUNNER_TEMP/evidence/host.txt"
          xcodebuild -version >> "$RUNNER_TEMP/evidence/host.txt"
      # 产品 pin 不变；仅在临时 worktree 覆盖缓存入口并记录，避免旧版 MBX 重新启用原生 S3。
      - name: Stage current cache entry for the immutable product
        run: |
          python3 scripts/build-cache/stage-mobile-snapshot.py mobile
          echo "UC_ENGINE_SNAPSHOT_AUTOMATION=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Restore product CAS snapshot
        uses: ./.github/actions/mbx-snapshot
        with:
          scene: mobile-product-${{ matrix.platform }}
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Build and verify native Engine artifacts through Mobile
        working-directory: mobile
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          bash scripts/update-unified-engine-core.sh --platform "$PLATFORM"
          node scripts/verify-unified-engine-core.mjs --prepared --platform "$PLATFORM"
      - name: Assert snapshot and local-only compilation
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          reports = list(Path(os.environ['UC_ENGINE_MBX_STATS_DIR']).glob('session.*/stats.json'))
          assert reports, 'No native MBX statistics'
          keys = ['hits', 'restored_output_files', 'downloaded_bytes', 'uploaded_bytes', 'remote_failures', 'background_upload_failures']
          totals = dict.fromkeys(keys, 0)
          for file in reports:
              report = json.loads(file.read_text())
              for key in keys:
                  totals[key] += report[key]
          Path(os.environ['RUNNER_TEMP'], 'evidence', 'cache-totals.json').write_text(json.dumps(totals, indent=2))
          print(totals)
          snapshot = json.loads((Path(os.environ['UC_ENGINE_MBX_STATS_DIR']) / 'snapshot-restore.json').read_text())
          if snapshot['status'] == 'hit':
              assert totals['hits'] > 0 and totals['restored_output_files'] > 0
          assert totals['downloaded_bytes'] == 0
          assert totals['uploaded_bytes'] == totals['remote_failures'] == totals['background_upload_failures'] == 0
          PY
      - name: Preserve native evidence and packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-cache-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/mbx-evidence
            ${{ runner.temp }}/mobile-target/uc-engine-uniffi-dist/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

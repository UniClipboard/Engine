name: MBX CAS snapshot validation

# 只在主线保护与 writer 环境同时成立时发布；PR 使用现有只读环境，不接入 release/tag。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - scripts/build-cache/**
      - .github/actions/snapshot-tests/**
      - .github/actions/mbx-snapshot/**
      - .github/actions/rust-ci-setup/**
      - .github/workflows/mbx-r2-cache.yml
      - docs/design-docs/local-builds.md

permissions:
  contents: read

concurrency:
  group: mbx-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache:
    name: MBX snapshot (${{ matrix.runner }})
    # fork/Dependabot 没有凭据，明确跳过而不是报告远端验收通过。
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    environment:
      name: ${{ github.event_name == 'push' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 45
    env:
      # MBX 1.24.0 同时用于单次构建下载预算和本地动作缓存 GC；不是整个 job 的磁盘上限。
      MBX_GC_MAX_SIZE: 40GiB
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Require protected main for publication
        if: github.event_name == 'push'
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [[ "$REF_PROTECTED" != true ]]; then
            echo '::error::MBX publication requires a genuinely protected main branch'
            exit 1
          fi

      # 与 PR 检查及移动端发布使用同一 Apple 工具链。
      - name: Select Xcode 16.4
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake

      - name: Test snapshot boundaries and native round trip
        uses: ./.github/actions/snapshot-tests

      - name: Prepare isolated outputs
        run: |
          rustup show active-toolchain
          mkdir -p "$RUNNER_TEMP/mbx-r2-evidence"
          {
            echo "CARGO_INCREMENTAL=0"
            echo "UC_ENGINE_SOURCE_COMMIT=$(git rev-parse HEAD)"
            echo "UC_ENGINE_SOURCE_STATE=clean"
          } >> "$GITHUB_ENV"

      - name: Prepare local-only MBX
        shell: bash
        run: |
          bash scripts/build-cache/start-ci-mbx.sh
          echo "UC_ENGINE_MBX_STATS_DIR=$RUNNER_TEMP/mbx-r2-evidence" >> "$GITHUB_ENV"
          echo "MBX_CACHE_EXPORT_GROUP=r2-validation" >> "$GITHUB_ENV"

      # 只采集资源计数，不列连接、进程环境或文件路径；不修改 runner 的系统配置。
      - name: Record macOS resource baseline
        if: runner.os == 'macOS'
        run: |
          {
            ulimit -a
            sysctl kern.ipc.maxsockbuf kern.maxfiles kern.maxfilesperproc
            sysctl net.inet.tcp.autorcvbufmax net.inet.tcp.autosndbufmax
            netstat -m
            vm_stat
          } | tee "$RUNNER_TEMP/mbx-r2-evidence/resources-before.txt"

      - name: Bound macOS TCP buffer growth
        if: runner.os == 'macOS'
        run: bash scripts/build-cache/prepare-ci-network.sh

      - name: Compile and run Engine migration locally
        env:
          MBX_CACHE_DIR: ${{ runner.temp }}/mbx-r2-producer-cache
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/mbx-r2-producer
          MBX_STATS_REPORT: ${{ runner.temp }}/mbx-r2-evidence/producer.json
        run: |
          python3 scripts/build-cache/record-r2-disk.py before
          trap 'python3 scripts/build-cache/record-r2-disk.py after' EXIT
          bash scripts/build-cache/mbx.sh --mbx doctor --json > "$RUNNER_TEMP/mbx-r2-evidence/doctor.json"
          python3 scripts/build-cache/verify-r2-build.py -- bash scripts/build-cache/mbx.sh test -p uc-engine --test config_migration_round_trip_e2e --locked

      # check 与测试构建的 rustc 输出/manifest 不同，主线也播种 worker 常用的完整检查命令。
      - name: Compile workspace check actions locally
        if: github.event_name == 'push'
        env:
          MBX_CACHE_DIR: ${{ runner.temp }}/mbx-r2-producer-cache
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/mbx-r2-producer
          MBX_STATS_REPORT: ${{ runner.temp }}/mbx-r2-evidence/producer-check.json
        run: |
          python3 scripts/build-cache/record-r2-disk.py before
          trap 'python3 scripts/build-cache/record-r2-disk.py after' EXIT
          python3 scripts/build-cache/verify-r2-build.py -- bash scripts/build-cache/mbx.sh check --workspace --all-targets --locked

      - name: Publish validated archive
        if: github.event_name == 'push'
        uses: ./.github/actions/mbx-snapshot
        env:
          MBX_CACHE_DIR: ${{ runner.temp }}/mbx-r2-producer-cache
        with:
          operation: save
          scene: r2-validation
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Restore independent consumer snapshot
        uses: ./.github/actions/mbx-snapshot
        env:
          MBX_CACHE_DIR: ${{ runner.temp }}/mbx-r2-consumer-cache
        with:
          scene: r2-validation
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
          require-hit: ${{ github.event_name == 'push' && 'true' || 'false' }}

      - name: Verify independent workspace check consumer
        env:
          MBX_CACHE_DIR: ${{ runner.temp }}/mbx-r2-consumer-cache
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/mbx-r2-consumer
          MBX_STATS_REPORT: ${{ runner.temp }}/mbx-r2-evidence/consumer-check.json
        run: |
          python3 scripts/build-cache/record-r2-disk.py before
          trap 'python3 scripts/build-cache/record-r2-disk.py after' EXIT
          python3 scripts/build-cache/verify-r2-build.py --consumer -- bash scripts/build-cache/mbx.sh check --workspace --all-targets --locked

      # 使用独立 target/动作缓存；PR 只读既有种子，不能声称验证了本次主线发布。
      - name: Verify independent snapshot consumer
        env:
          MBX_CACHE_DIR: ${{ runner.temp }}/mbx-r2-consumer-cache
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/mbx-r2-consumer
          MBX_STATS_REPORT: ${{ runner.temp }}/mbx-r2-evidence/consumer.json
        run: |
          python3 scripts/build-cache/record-r2-disk.py before
          trap 'python3 scripts/build-cache/record-r2-disk.py after' EXIT
          python3 scripts/build-cache/verify-r2-build.py --consumer -- bash scripts/build-cache/mbx.sh test -p uc-engine --test config_migration_round_trip_e2e --locked

      - name: Record macOS resource outcome
        if: always() && runner.os == 'macOS'
        run: |
          {
            netstat -m
            vm_stat
          } | tee "$RUNNER_TEMP/mbx-r2-evidence/resources-after.txt"
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'mbx-r2-evidence'
          def denied(name):
              matches = re.findall(r'^(\d+) requests for memory denied$', (root / name).read_text(), re.M)
              return int(matches[0]) if matches else 0
          before, after = denied('resources-before.txt'), denied('resources-after.txt')
          print(f'mbuf allocation denials: {before} -> {after}')
          assert after == before, 'macOS network buffer allocation failures increased'
          PYCODE

      - name: Retain R2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mbx-r2-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/mbx-r2-evidence
          if-no-files-found: warn

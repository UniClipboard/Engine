name: PR Check

# 分两层运行：
# - 产品门禁（完整范围 PR）：macOS 编译与仓库规则检查，以及 Linux 上一次构建完成的全工作区测试、
#   testkit 证据、成员多设备 smoke、隔离网络配对 smoke、presence 升级／恢复矩阵及移动绑定编译。
# - 完整检查（合并队列、主线推送、手工触发，或带 full-ci 标签的 PR）：Rust 覆盖率与四种真实网络模式。
#   各模式的重复轮次与成员多设备全集由 engine-real-environment.yml 的 nightly 负责。
on:
  workflow_dispatch:
  pull_request:
    branches: [main, migration/initial-core-import]
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  push:
    branches: [main, migration/initial-core-import]

permissions:
  contents: read

concurrency:
  # 添加其他标签不应取消进行中的检查，因此标签事件按标签名单独成组。
  group: pr-check-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'run' }}
  cancel-in-progress: true

jobs:
  scope:
    uses: ./.github/workflows/pr-scope.yml

  snapshot-linux:
    name: Snapshot tools on Linux
    timeout-minutes: 15
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.scope == 'snapshot' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/snapshot-tests

  checks:
    name: Engine repository checks
    needs: [scope, snapshot-linux]
    if: always() && !cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    # 保持 Apple Silicon 宿主；固定 Xcode，避免镜像默认工具链漂移。
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    # 编译缓存凭据：只有 main 上的可信运行绑定限定 main 分支的写入环境，其余运行（PR、合并队列、其他分支）用只读令牌；
    # fork 与 Dependabot 拿不到任何 secret，只进行本地冷编译。
    # 本文件其余 Rust job 使用相同绑定；详见 docs/design-docs/decisions/033-unified-mbx-rust-builds.md。
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check apt download cache boundaries
        run: python3 scripts/ci/apt-download-cache.test.py

      - name: Validate scope policy and patch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCOPE: ${{ needs.scope.result == 'success' && needs.scope.outputs.scope || 'full' }}
          LINUX_RESULT: ${{ needs.snapshot-linux.result }}
        run: |
          if [[ "$SCOPE" == snapshot && "$LINUX_RESULT" != success ]]; then
            echo '::error::Linux snapshot validation did not succeed'
            exit 1
          fi
          python3 scripts/ci/pr-scope.test.py
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff --check
          fi

      # 独立 Git consumer 检查通过 just cargo 运行，先显式准备该工具。
      - name: Install just
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just

      - name: Prepare Rust build
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: rust-checks-macos
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Verify Cargo Git source provenance
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UC_ENGINE_MBX_LOCAL_ONLY: '1'
        run: |
          source scripts/build-cache/env.sh
          python3 scripts/testing/verify-build-source.py \
            --workspace-parent "$RUNNER_TEMP" \
            --evidence "$RUNNER_TEMP/build-source-evidence" \
            --source-revision "$SOURCE_SHA"

      - name: Retain Cargo Git source provenance evidence
        if: always() && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-source-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/build-source-evidence
          if-no-files-found: warn

      - name: Validate workspace metadata
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check all workspace targets
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        run: cargo check --workspace --all-targets --locked

      - name: Check formatting
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        run: cargo fmt --all -- --check

      - name: Check repository ownership and release rules
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        run: node scripts/architecture/check-engine-repository.mjs

      - name: Install just
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just

      - name: Verify independent Engine Git consumer
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        run: node scripts/architecture/check-engine-git-consumer.mjs
        env:
          RUST_STYLE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Check no direct tracing log macros
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        run: node scripts/architecture/check-direct-log-macros.mjs

      # 公告库在运行时拉取最新版本，工具版本固定并与本地 cargo audit 一致。漏洞与 unsound 公告都会阻断，
      # 当前锁无需任何例外；新增公告必须通过升级修复，不得以忽略方式放行。
      - name: Install cargo-audit
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-audit@0.22.2

      - name: Check pinned OPAQUE sources
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        run: node scripts/architecture/check-opaque-dependency-source.mjs

      - name: Verify fixed-old OPAQUE compatibility
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        run: node scripts/testing/run-opaque-dependency-compat.mjs

      - name: Audit locked dependencies
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        run: cargo audit --deny unsound

      - name: Check mobile build profiles and CI compile cache boundaries
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        run: >-
          node --test scripts/architecture/check-mobile-build-profile.test.mjs scripts/release/build-profile.test.mjs
          scripts/architecture/check-direct-log-macros.test.mjs
          scripts/testing/relay-recovery-support.test.mjs
          scripts/testing/connection-recovery-session.test.mjs
          scripts/testing/connection-recovery-host.test.mjs
          scripts/testing/clipboard-delivery-evidence.test.mjs
          scripts/testing/transfer-progress-evidence.test.mjs
          scripts/testing/verify-progress-connectivity.test.mjs

      - name: Check snapshot-only cache boundaries
        if: needs.scope.result != 'success' || needs.scope.outputs.scope != 'docs'
        uses: ./.github/actions/snapshot-tests

      - name: Check patch whitespace
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        run: git diff --check

      # 未插桩构建必须能解析出真实符号；Linux 的内联帧只有短名称，该项只在 macOS 校验。
      - name: Validate captured diagnostic stacks
        if: (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        run: cargo test -p uc-infra-profile --test peer_address_read_diagnostics --locked

  # 升级兼容冒烟：上一个 Desktop 锚点到当前源码的 5 个单元；旧版宿主按 rev 与宿主摘要缓存，命中时不重建。

      - name: Publish scenario CAS snapshot
        if: (success() && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'schedule')) && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        uses: ./.github/actions/mbx-snapshot
        with:
          operation: save
          scene: rust-checks-macos
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Retain OPAQUE compatibility evidence
        if: (always()) && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-compatibility-${{ runner.os }}
          path: target/test-reports/opaque-compat
          if-no-files-found: warn

      - name: Retain MBX compiler evidence
        if: (always()) && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mbx-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/mbx-evidence
          if-no-files-found: warn

  upgrade-matrix-smoke:
    name: Upgrade compatibility smoke
    needs: scope
    if: always() && !cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 60
    env:
      UC_TEST_ARTIFACTS_DIR: target/test-artifacts/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        uses: ./.github/actions/apt-download-cache
        with:
          packages: clang libclang-dev cmake

      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: rust-upgrade-matrix-linux
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Cache anchor hosts
        uses: actions/cache@v4
        with:
          path: |
            target/upgrade-anchors/*/bin
            target/upgrade-anchors/*/host.json
          key: upgrade-anchors-${{ runner.os }}-${{ hashFiles('tests/upgrade-matrix/anchors.json', 'tests/upgrade-matrix/host-features.json', 'tests/upgrade-matrix/anchors/**', 'tests/hosts/connectivity/**', 'scripts/testing/build-upgrade-anchors.sh') }}
          restore-keys: upgrade-anchors-${{ runner.os }}-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-nextest@0.9.145

      - name: Run upgrade compatibility smoke
        run: bash scripts/testing/run-test-group.sh upgrade-matrix --smoke

      - name: Keep upgrade smoke report
        run: |
          mkdir -p target/test-reports
          cp target/nextest/ci/junit.xml target/test-reports/upgrade-smoke.xml

      - name: Validate fixed-main membership history in both directions
        run: bash scripts/testing/run-fixed-main-history-interop.sh

      - name: Validate fixed-main active clipboard in both directions
        run: bash scripts/testing/run-fixed-main-active-clipboard-interop.sh

      - name: Retain upgrade smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-upgrade-matrix-smoke
          path: |
            target/nextest/ci/junit.xml
            target/test-artifacts/ci/upgrade-matrix
            target/test-reports/upgrade-smoke.xml
            target/upgrade-anchors/*/host.json
            target/fixed-main-history/source-revision.txt
            target/fixed-main-history/binary-sha256.txt
            target/active-clipboard-connectivity-evidence/fixed-main
          if-no-files-found: error

      - name: Publish scenario CAS snapshot
        if: success() && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: ./.github/actions/mbx-snapshot
        with:
          operation: save
          scene: rust-upgrade-matrix-linux
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Retain MBX compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mbx-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/mbx-evidence
          if-no-files-found: warn

  tests:
    name: Engine tests
    needs: scope
    if: always() && !cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    # workspace、恢复进程组和原固定资源负载均为必需；#345首轮在成员smoke阶段触及90分钟整组上限。
    # 仅将整组CI预算调整为120分钟，保留各测试原期限、负载、资源阈值和零重试。
    timeout-minutes: 120
    env:
      # 所有测试组共用同一次全工作区构建，只编译一次。
      UC_TEST_BUILD_SCOPE: workspace
      UC_TEST_ARTIFACTS_DIR: target/test-artifacts/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Install network test tools
        uses: ./.github/actions/apt-download-cache
        with:
          packages: iproute2 nftables iputils-ping file clang libclang-dev cmake

      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: rust-tests-linux
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-nextest@0.9.145

      - name: Build workspace tests
        run: cargo nextest run --profile ci --locked --workspace --all-targets --no-run

      - name: Run workspace tests
        id: workspace_tests
        run: |
          rm -f target/nextest/ci/junit.xml
          bash scripts/testing/run-test-group.sh workspace
        env:
          # Linux 内联帧可能只有短名称；校验实际可用符号，完整符号由 macOS checks job 校验。
          UC_EXPECT_DIAGNOSTIC_STACK: available

      - name: Keep workspace test report
        if: always() && (steps.workspace_tests.outcome == 'success' || steps.workspace_tests.outcome == 'failure')
        run: mkdir -p target/test-reports && cp target/nextest/ci/junit.xml target/test-reports/workspace.xml || true

      - name: Retain workspace failure before remaining groups
        if: failure() && steps.workspace_tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-workspace-failure
          path: target/test-reports/workspace.xml
          if-no-files-found: ignore

      - name: Run branch recovery process and checkpoint tests
        if: success() || failure()
        id: branch_recovery_process
        run: |
          rm -f target/nextest/ci/junit.xml
          cargo nextest run --profile ci --locked -p uc-connectivity-host \
            --features branch-recovery-fault-tests,uc-engine/branch-recovery-fault-tests --test branch_recovery

      - name: Keep branch recovery process report
        if: always() && (steps.branch_recovery_process.outcome == 'success' || steps.branch_recovery_process.outcome == 'failure')
        run: mkdir -p target/test-reports && cp target/nextest/ci/junit.xml target/test-reports/branch-recovery-process.xml || true

      - name: Install just for current-authority registration proof
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just

      - name: Verify registration against actual receive authority
        run: node scripts/testing/run-progress-registration-proof.mjs

      - name: Run mandatory blob lifecycle resources
        if: success() || failure()
        id: blob_lifecycle_resources
        run: |
          rm -f target/nextest/ci/junit.xml
          bash scripts/testing/run-blob-lifecycle-resources.sh
        env:
          UC_EXPECT_DIAGNOSTIC_STACK: available
          # 双1GiB资源基线仅开发者本机显式运行；CI保留其余生命周期、配额与容量验收。

      - name: Keep blob lifecycle resource report
        if: always() && (steps.blob_lifecycle_resources.outcome == 'success' || steps.blob_lifecycle_resources.outcome == 'failure')
        run: mkdir -p target/test-reports && cp target/nextest/ci/junit.xml target/test-reports/blob-lifecycle-resources.xml || true

      - name: Run testkit evidence suites
        if: success() || failure()
        id: testkit_evidence
        run: |
          rm -f target/nextest/ci/junit.xml
          bash scripts/testing/run-test-group.sh evidence

      - name: Keep testkit evidence report
        if: always() && (steps.testkit_evidence.outcome == 'success' || steps.testkit_evidence.outcome == 'failure')
        run: mkdir -p target/test-reports && cp target/nextest/ci/junit.xml target/test-reports/evidence.xml || true

      - name: Run membership smoke scenarios
        if: success() || failure()
        id: membership_smoke
        run: |
          rm -f target/nextest/ci/junit.xml
          bash scripts/testing/run-test-group.sh membership-e2e \
            -E 'test(/^automatic_connections::/) | test(/^removal_convergence::/) | test(=admission::fresh_device_join_completes_through_stable_operations)'

      - name: Keep membership smoke report
        if: always() && (steps.membership_smoke.outcome == 'success' || steps.membership_smoke.outcome == 'failure')
        run: mkdir -p target/test-reports && cp target/nextest/ci/junit.xml target/test-reports/membership-e2e-smoke.xml || true

      # 在隔离网络中完成三节点配对与文本、文件双向传输；其余场景与重复轮次属于完整检查和 nightly。
      - name: Validate relay-only membership history reuse
        run: bash scripts/testing/run-membership-history-relay.sh

      - name: Validate direct active clipboard complete content
        run: bash scripts/testing/run-active-clipboard-connectivity.sh direct

      - name: Validate relay-only active clipboard complete content
        run: bash scripts/testing/run-active-clipboard-connectivity.sh relay

      - name: Validate cloud outage with only mDNS discovery
        run: bash scripts/testing/run-discovery-connectivity.sh

      - name: Run isolated network pairing smoke
        if: success() || failure()
        run: >-
          bash scripts/testing/run-connection-recovery-e2e.sh
          --suite network --mode direct --repeat 1 --case E02 --prebuilt

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-test-evidence
          path: |
            target/test-reports
            target/test-artifacts/ci
            target/test-artifacts/membership-recovery
            target/test-artifacts/real-dependencies
            target/membership-history-relay
            target/connection-recovery-evidence
            target/active-clipboard-connectivity-evidence/direct
            target/active-clipboard-connectivity-evidence/relay
            target/discovery-connectivity-evidence
          if-no-files-found: error

      - name: Publish scenario CAS snapshot
        if: success() && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: ./.github/actions/mbx-snapshot
        with:
          operation: save
          scene: rust-tests-linux
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Retain MBX compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mbx-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/mbx-evidence
          if-no-files-found: warn

  peer-reachability:
    name: Peer reachability required network and upgrade matrix
    needs: scope
    if: always() && !cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install mandatory network and build tools
        uses: ./.github/actions/apt-download-cache
        with:
          packages: iproute2 nftables iputils-ping file clang libclang-dev cmake ripgrep
      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: peer-reachability-linux
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Install just
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just
      - name: Run complete mandatory presence matrix
        run: bash scripts/testing/run-peer-reachability-connectivity.sh
      - name: Retain sanitized matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: peer-reachability-connectivity-evidence
          path: |
            target/peer-reachability-connectivity-evidence/**/*.json
            target/peer-reachability-connectivity-evidence/**/*.txt
            target/peer-reachability-connectivity-evidence/*.log
            target/upgrade-anchors/*/host.json
          if-no-files-found: error

      - name: Publish scenario CAS snapshot
        if: success() && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: ./.github/actions/mbx-snapshot
        with:
          operation: save
          scene: peer-reachability-linux
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

  blob-connectivity:
    name: Blob transfer required network and upgrade matrix
    needs: scope
    if: always() && !cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install mandatory network and build tools
        uses: ./.github/actions/apt-download-cache
        with:
          packages: iproute2 nftables iputils-ping file clang libclang-dev cmake ripgrep
      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: blob-connectivity-linux
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Install just
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just
      - name: Run required progress and fixed legacy matrix
        run: bash scripts/testing/run-progress-connectivity.sh
      - name: Run complete mandatory blob matrix
        run: bash scripts/testing/run-blob-connectivity.sh
      - name: Retain sanitized blob evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blob-connectivity-evidence
          path: |
            target/blob-connectivity-evidence/runs/**/*.json
            target/blob-connectivity-evidence/runs/**/*.txt
            target/blob-connectivity-evidence/runs/**/*.log
            target/blob-connectivity-evidence/frozen-main/*.txt
            target/progress-connectivity-evidence/runs/**/*.json
            target/progress-connectivity-evidence/runs/**/*.txt
            target/progress-connectivity-evidence/runs/**/*.log
            target/progress-legacy-evidence/runs/**/*.json
            target/progress-legacy-evidence/runs/**/*.txt
            target/progress-legacy-evidence/runs/**/*.log
            target/upgrade-anchors/*/host.json
          if-no-files-found: error

      - name: Publish scenario CAS snapshot
        if: success() && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: ./.github/actions/mbx-snapshot
        with:
          operation: save
          scene: blob-connectivity-linux
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

  mobile-bindings:
    name: Mobile binding compile ${{ matrix.platform }}
    needs: scope
    if: always() && !cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
    runs-on: macos-15
    timeout-minutes: 60
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      UC_ENGINE_UNIFFI_BUILD_LOCKED: '1'
      UC_ENGINE_UNIFFI_BUILD_PROFILE: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: pr-mobile-${{ matrix.platform }}
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Install iOS targets
        if: matrix.platform == 'ios'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Build iOS binding
        if: matrix.platform == 'ios'
        run: bash bindings/uc-engine-uniffi/scripts/build-ios-xcframework.sh
      - name: Build iOS probe core
        if: matrix.platform == 'ios'
        run: |
          source scripts/build-cache/env.sh
          export IPHONEOS_DEPLOYMENT_TARGET=17.0
          # 探针与生产绑定共用已安装目标、dev配置和编译缓存；编译不表示真机验收通过。
          for probe_target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            cargo build -p uc-mobile-probe-core --lib --profile dev --target "$probe_target" --locked
          done
      - name: Install Android targets and helper
        if: matrix.platform == 'android'
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          source scripts/build-cache/env.sh
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Android binding
        if: matrix.platform == 'android'
        run: bash bindings/uc-engine-uniffi/scripts/build-android-aar.sh
      - name: Build Android probe core
        if: matrix.platform == 'android'
        run: |
          source scripts/build-cache/env.sh
          # 复用原arm64目标和cargo-ndk，不生成第二套JNI打包目录。
          cargo ndk -t arm64-v8a build -p uc-mobile-probe-core --lib --profile dev --locked

      - name: Publish scenario CAS snapshot
        if: success() && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: ./.github/actions/mbx-snapshot
        with:
          operation: save
          scene: pr-mobile-${{ matrix.platform }}
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

  harmonyos-binding:
    name: HarmonyOS binding compile
    needs: scope
    # 外部 fork 不在持有 SDK 的 self-hosted 机器执行源码；其平台验收保留跳过，不登记通过。
    if: >-
      always() && !cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
      && (needs.scope.result != 'success' || (needs.scope.outputs.scope != 'docs' && needs.scope.outputs.scope != 'snapshot'))
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, deveco]
    timeout-minutes: 45
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: pr-harmonyos
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Compile existing HarmonyOS binding with the real SDK
        shell: bash
        run: |
          source scripts/build-cache/env.sh
          rustup target add aarch64-unknown-linux-ohos
          native_root="${DEVECO_STUDIO_CONTENTS:-/Applications/DevEco-Studio.app/Contents}/sdk/default/openharmony/native"
          CC_aarch64_unknown_linux_ohos="$native_root/llvm/bin/aarch64-unknown-linux-ohos-clang" \
          CXX_aarch64_unknown_linux_ohos="$native_root/llvm/bin/aarch64-unknown-linux-ohos-clang++" \
          AR_aarch64_unknown_linux_ohos="$native_root/llvm/bin/llvm-ar" \
          CMAKE="$native_root/build-tools/cmake/bin/cmake" \
            cargo check --locked -p uc-ohos-napi --target aarch64-unknown-linux-ohos

      - name: Publish scenario CAS snapshot
        if: success() && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: ./.github/actions/mbx-snapshot
        with:
          operation: save
          scene: pr-harmonyos
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

  coverage:
    name: Rust coverage
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'full-ci')
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: rust-coverage-linux
          fast-compile-infra: "true"
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Install coverage tools
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-llvm-cov,cargo-nextest@0.9.145

      # 插桩可能改变内联，允许 unresolved，但不要求符号必须丢失；完整符号由 checks job 验证。
      # 升级兼容矩阵依赖先构建的旧版宿主，只经 upgrade-matrix 分组运行，不计入覆盖率。
      - name: Generate Rust coverage
        run: >-
          cargo llvm-cov nextest --workspace --all-targets --locked
          --ignore-filename-regex 'crates/uc-engine/src/dev/'
          --lcov --output-path lcov.info
          -E 'not kind(bench) & not package(uc-upgrade-matrix)'
        env:
          NEXTEST_PROFILE: ci
          UC_EXPECT_DIAGNOSTIC_STACK: available

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          disable_search: true
          fail_ci_if_error: true
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish scenario CAS snapshot
        if: success() && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: ./.github/actions/mbx-snapshot
        with:
          operation: save
          scene: rust-coverage-linux
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Retain MBX compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mbx-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/mbx-evidence
          if-no-files-found: warn

  connection-recovery:
    # 名称不引用矩阵变量：job 级 if 先于矩阵展开求值，被跳过时引用无法展开；运行时 GitHub 自动追加矩阵值。
    name: Connection recovery on isolated Linux networks
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'full-ci')
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/main' && matrix.mode == 'direct' && 'engine-build-cache-writer' || 'engine-build-cache-reader' }}
      deployment: false
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, known-peer, relay, legacy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install network test tools
        uses: ./.github/actions/apt-download-cache
        with:
          packages: iproute2 nftables iputils-ping file clang libclang-dev cmake

      - name: Prepare Rust build
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-key: connection-recovery-linux
          compile-cache-r2-endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          compile-cache-r2-access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          compile-cache-r2-secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Validate connection liveness and recovery
        run: bash scripts/testing/run-connection-recovery-e2e.sh --suite network --repeat 1 --mode "${{ matrix.mode }}"

      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connection-recovery-evidence-${{ matrix.mode }}
          path: target/connection-recovery-evidence
          if-no-files-found: warn

      # 仅可信生产者补齐共同宿主和 relay 变体的编译图；四种模式仍自行编译并执行实际网络验证。
      - name: Compile remaining shared network host actions
        if: success() && matrix.mode == 'direct' && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'schedule')
        run: cargo build -p uc-connectivity-host -p uc-connectivity-relay --locked
      # 仅 direct 发布，其他 shard 不重复归档和覆盖索引。
      - name: Publish scenario CAS snapshot
        if: success() && matrix.mode == 'direct' && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: ./.github/actions/mbx-snapshot
        with:
          operation: save
          scene: connection-recovery-linux
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Retain MBX compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mbx-${{ github.job }}-${{ matrix.mode }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/mbx-evidence
          if-no-files-found: warn

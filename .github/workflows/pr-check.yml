name: PR Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main, migration/initial-core-import]
  push:
    branches: [main, migration/initial-core-import]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connection-recovery:
    name: Connection recovery on isolated Linux networks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install network test tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables iputils-ping file clang libclang-dev cmake
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: connection-recovery-linux
      - name: Validate connection liveness and recovery
        run: bash scripts/testing/run-connection-recovery-e2e.sh --suite all --repeat 3
      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connection-recovery-evidence
          path: target/connection-recovery-evidence
          if-no-files-found: warn
  checks:
    name: Engine repository checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Validate workspace metadata
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check all workspace targets
        run: cargo check --workspace --all-targets --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check repository ownership and release rules
        run: node scripts/architecture/check-engine-repository.mjs
        env:
          RUST_STYLE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Check mobile build profiles
        run: node --test scripts/architecture/check-mobile-build-profile.test.mjs scripts/release/build-profile.test.mjs

      - name: Check patch whitespace
        run: git diff --check

  coverage:
    name: Rust coverage
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: . -> target
          shared-key: rust-coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-llvm-cov

      - name: Validate automatic connections without coverage instrumentation
        run: "cargo test -p uc-engine --features dev-tools --test space_membership_auto_pairing_e2e --locked -- automatic_connections:: --test-threads=1"

      - name: Generate Rust coverage
        run: cargo llvm-cov --workspace --all-targets --locked --lcov --output-path lcov.info

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          disable_search: true
          fail_ci_if_error: true
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

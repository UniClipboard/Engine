[workspace]
members = [
  "crates/uc-engine",
  "crates/uc-core",
  "crates/uc-application",
  "crates/uc-infra-local",
  "crates/uc-infra-crypto",
  "crates/uc-infra-security",
  "crates/uc-infra-storage",
  "crates/uc-infra-content",
  "crates/uc-infra-p2p",
  "crates/uc-infra-profile",
  "crates/uc-sync-protocol",
  "crates/uc-content-hash",
  "crates/uc-observability-contract",
  "crates/uc-observability-runtime",
  "bindings/uc-engine-uniffi",
  "bindings/uc-ohos-napi",
  "compatibility/uc-mobile-proto",
  "compatibility/uc-mobile",
  "compatibility/uc-mobile-lan",
  "tests/hosts/uc-mobile-probe-core",
  "tests/hosts/connectivity",
  "tests/hosts/connectivity-relay",
  "tests/openmls-validation",
  "tests/uc-testkit",
  "tests/upgrade-matrix",
]
exclude = ["third_party/swarm-discovery", "third_party/iroh-mdns-address-lookup"]
resolver = "2"

[workspace.package]
version = "1.1.0-rc.23"
license = "Apache-2.0"

# 生产与验证共用不可变上游密码依赖；下游消费 Engine 时同样生效。
[workspace.dependencies]
openmls = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51", features = ["fork-resolution"] }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51" }
openmls_memory_storage = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51", features = ["test-utils"] }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51" }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

# 根补丁只在最终构建工作区生效；宿主同步本段，见 ADR-034。
# UniClipboard fork 保留上游 43e232f 的路径队列修复，仅固定经过修复的 DNS 依赖链。
# 四个包同时覆盖，避免 iroh-tickets / iroh-util 引入第二份 iroh-base。
# 上游完整发布路径队列与 EDNS 修复后退出 fork；iroh-blobs 和 mDNS 来源不变。
[patch.crates-io]
iroh = { git = "https://github.com/UniClipboard/iroh.git", rev = "c8efae061e3daa0afc6aa6db856cfcf8576da97b" }
iroh-base = { git = "https://github.com/UniClipboard/iroh.git", rev = "c8efae061e3daa0afc6aa6db856cfcf8576da97b" }
iroh-dns = { git = "https://github.com/UniClipboard/iroh.git", rev = "c8efae061e3daa0afc6aa6db856cfcf8576da97b" }
iroh-relay = { git = "https://github.com/UniClipboard/iroh.git", rev = "c8efae061e3daa0afc6aa6db856cfcf8576da97b" }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

# 移动端开发构建会走完整的加密 blob 流程。保持 Infra 优化，避免大图在
# 仅由开发配置放大的压缩、分块和本地发布阶段耗费数秒。
[profile.dev.package.uc-infra-profile]
opt-level = 3
[profile.dev.package.uc-infra-local]
opt-level = 3
[profile.dev.package.uc-infra-crypto]
opt-level = 3
[profile.dev.package.uc-infra-security]
opt-level = 3
[profile.dev.package.uc-infra-storage]
opt-level = 3
[profile.dev.package.uc-infra-content]
opt-level = 3
[profile.dev.package.uc-infra-p2p]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"

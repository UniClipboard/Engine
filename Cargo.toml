[workspace]
members = [
  "crates/uc-engine",
  "crates/uc-core",
  "crates/uc-application",
  "crates/uc-infra",
  "crates/uc-infra-local",
  "crates/uc-infra-crypto",
  "crates/uc-sync-protocol",
  "crates/uc-content-hash",
  "crates/uc-observability-contract",
  "crates/uc-observability-runtime",
  "bindings/uc-engine-uniffi",
  "bindings/uc-ohos-napi",
  "compatibility/uc-mobile-proto",
  "compatibility/uc-mobile",
  "compatibility/uc-mobile-lan",
  "tests/hosts/uc-mobile-probe-core",
  "tests/hosts/connectivity",
  "tests/hosts/connectivity-relay",
  "tests/openmls-validation",
  "tests/uc-testkit",
  "tests/upgrade-matrix",
]
exclude = ["third_party/swarm-discovery", "third_party/iroh-mdns-address-lookup"]
resolver = "2"

[workspace.package]
version = "1.1.0-rc.22"
license = "Apache-2.0"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

# No [patch] section on purpose: [patch] is only read from the root manifest of a build, so it would not reach
# repositories that depend on Engine. The iroh-blobs fork is a git dependency of uc-infra, and the patched
# swarm-discovery (with the vendored iroh-mdns-address-lookup) is a path dependency of uc-infra.

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

# 移动端开发构建会走完整的加密 blob 流程。保持 Infra 优化，避免大图在
# 仅由开发配置放大的压缩、分块和本地发布阶段耗费数秒。
[profile.dev.package.uc-infra]
opt-level = 3
[profile.dev.package.uc-infra-local]
opt-level = 3
[profile.dev.package.uc-infra-crypto]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"

[profile.default]
retries = 0
fail-fast = true
status-level = "pass"
final-status-level = "slow"
slow-timeout = { period = "10s", terminate-after = 2 }

[profile.ci]
inherits = "default"
# 多个真实 Engine 自带运行时；固定外部并发，避免宿主核数放大负载并改变真实关闭期限的验收条件。
# 用例内部的并发、超时和零重试合同不变，本地与线上使用同一资源预算。
test-threads = 2
fail-fast = false
junit = { path = "junit.xml" }

[test-groups.fast]
max-threads = 2

[test-groups.persistence-provider]
max-threads = 1

[test-groups.engine-smoke]
max-threads = 1

[test-groups.process]
max-threads = 1

[test-groups.real-network]
max-threads = 1

[test-groups.device]
max-threads = 1

# 以下两组测试在进程内用 ENGINE_TEST_LOCK 串行启动完整 Engine；nextest 每个测试一个进程，进程内锁失效，
# 由测试组恢复同样的串行约束。
[test-groups.engine-host-contract]
max-threads = 1

[test-groups.binding-contract]
max-threads = 1

# 成员多节点真实场景每项启动 2–10 个完整 Engine，单项常超过 20 秒；限制并发避免负载放大时序误差。
[test-groups.membership-e2e]
max-threads = 4

# 拓扑类场景每项 4–10 个 Engine，单独限制并发，避免与其他重场景叠加放大时序误差。
[test-groups.membership-topology]
max-threads = 2

# 升级兼容矩阵：每个单元启动 1–2 个完整 Engine 宿主进程；并发按本机核数保守限制。
[test-groups.upgrade-matrix]
max-threads = 4

# 进度连接验证真实31秒活动与随后30秒空闲回收；保留测试内部90秒截止与产品30秒策略。
# 外层120秒容纳完整场景及清理，仅匹配该用例，默认20秒终止线与零重试保持不变。
[[profile.default.overrides]]
filter = "package(uc-infra-p2p) & kind(lib) & test(=network::iroh::connectivity::stream::profile_probe::limits_probe::actual_work_leases_survive_thirty_seconds_then_real_idle_timer_closes_the_connection)"
test-group = "real-network"
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.ci.overrides]]

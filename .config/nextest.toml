# 大历史分页与完整准入交换测试本身较慢（约 30–60 秒），不是卡死。
[[profile.default.overrides]]
filter = "package(uc-core) & binary(membership_history_v2) & test(/^history_exchange_splits_the_256_/)"
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.overrides]]
filter = "package(uc-infra-p2p) & test(actual_client_exchange_reports_reply_failures_and_preserves_trace_result)"
slow-timeout = { period = "30s", terminate-after = 4 }

# 该测试先借用空闲 UDP 端口再以固定端口重启节点并核对端口已释放；并行时端口可能被其他测试的临时绑定占用，
# 因此独占运行。
[[profile.default.overrides]]
filter = "package(uc-infra-p2p) & binary(node_lifecycle)"
threads-required = "num-test-threads"

# 大历史分页与完整准入交换测试本身较慢（约 30–60 秒），不是卡死。
[[profile.ci.overrides]]
filter = "package(uc-core) & binary(membership_history_v2) & test(/^history_exchange_splits_the_256_/)"
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = "package(uc-infra-p2p) & test(actual_client_exchange_reports_reply_failures_and_preserves_trace_result)"
slow-timeout = { period = "30s", terminate-after = 4 }

# 该测试先借用空闲 UDP 端口再以固定端口重启节点并核对端口已释放；并行时端口可能被其他测试的临时绑定占用，
# 因此独占运行。
[[profile.ci.overrides]]
filter = "package(uc-infra-p2p) & binary(node_lifecycle)"
threads-required = "num-test-threads"

# 接收方进程崩溃后重启并续传文件，单项本身约 22 秒，不是卡死。
[[profile.default.overrides]]
filter = "package(uc-engine) & test(/host_adapter_contract::offline_lifecycle::crash::/)"
slow-timeout = { period = "30s", terminate-after = 3 }

# 慢 collector 用固定的响应延迟与导出超时验证 flush 期限；满载并行时调度抖动会让结果偏离预期，因此独占运行。
[[profile.default.overrides]]
filter = "package(uc-observability-runtime) & binary(collector_slow)"
threads-required = "num-test-threads"

# 接收方进程崩溃后重启并续传文件，单项本身约 22 秒，不是卡死。
[[profile.ci.overrides]]
filter = "package(uc-engine) & test(/host_adapter_contract::offline_lifecycle::crash::/)"
slow-timeout = { period = "30s", terminate-after = 3 }

# 慢 collector 用固定的响应延迟与导出超时验证 flush 期限；满载并行时调度抖动会让结果偏离预期，因此独占运行。
[[profile.ci.overrides]]
filter = "package(uc-observability-runtime) & binary(collector_slow)"
threads-required = "num-test-threads"

# 每项启动多个真实 Engine 宿主进程，单独运行约 5–10 秒；满载并行时会被拖过 20 秒。测试自身等待上限为 30 秒，
# 期限需大于它，且同组多进程场景之间不并发。
[[profile.default.overrides]]
filter = "package(uc-connectivity-host) & binary(space_device_update_recovery)"
test-group = "process"
slow-timeout = { period = "30s", terminate-after = 2 }

# 每项启动多个真实 Engine 宿主进程，单独运行约 5–10 秒；满载并行时会被拖过 20 秒。测试自身等待上限为 30 秒，
# 期限需大于它，且同组多进程场景之间不并发。
[[profile.ci.overrides]]
filter = "package(uc-connectivity-host) & binary(space_device_update_recovery)"
test-group = "process"
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]

[profile.default]
retries = 0
fail-fast = true
status-level = "pass"
final-status-level = "slow"
slow-timeout = { period = "10s", terminate-after = 2 }

[profile.ci]
inherits = "default"
fail-fast = false
junit = { path = "junit.xml" }

[test-groups.fast]
max-threads = 2

[test-groups.persistence-provider]
max-threads = 1

[test-groups.engine-smoke]
max-threads = 1

[test-groups.process]
max-threads = 1

[test-groups.real-network]
max-threads = 1

[test-groups.device]
max-threads = 1

# 成员多节点真实场景每项启动 2–10 个完整 Engine，单项常超过 20 秒；限制并发避免负载放大时序误差。
[test-groups.membership-e2e]
max-threads = 4

# 拓扑类场景每项 4–10 个 Engine，单独限制并发，避免与其他重场景叠加放大时序误差。
[test-groups.membership-topology]
max-threads = 2

[[profile.default.overrides]]
filter = "package(uc-testkit)"
test-group = "fast"
slow-timeout = { period = "2s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(uc-application) & (test(admission_recovery_scenarios) | test(device_trust_recovery_scenario) | test(legacy_candidate_convergence_scenario) | test(virtual_membership_network) | test(file_transfer_completion_scenario_reports_final_state) | test(text_transfer_scenario))"
test-group = "fast"
slow-timeout = { period = "2s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(uc-infra) & test(provider_dependency_evidence)"
test-group = "persistence-provider"
slow-timeout = { period = "5s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(uc-infra) & binary(profile_storage_upgrade_crash)"
test-group = "process"
slow-timeout = { period = "20s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = "package(uc-testkit)"
test-group = "fast"
slow-timeout = { period = "2s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = "package(uc-application) & (test(admission_recovery_scenarios) | test(device_trust_recovery_scenario) | test(legacy_candidate_convergence_scenario) | test(virtual_membership_network) | test(file_transfer_completion_scenario_reports_final_state) | test(text_transfer_scenario))"
test-group = "fast"
slow-timeout = { period = "2s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = "package(uc-infra) & test(provider_dependency_evidence)"
test-group = "persistence-provider"
slow-timeout = { period = "5s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = "package(uc-infra) & binary(profile_storage_upgrade_crash)"
test-group = "process"
slow-timeout = { period = "20s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(uc-engine) & binary(space_membership_auto_pairing_e2e) & test(/^topology::/)"
test-group = "membership-topology"
slow-timeout = { period = "60s", terminate-after = 10 }


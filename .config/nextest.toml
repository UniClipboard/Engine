[profile.default]
retries = 0
fail-fast = true
status-level = "pass"
final-status-level = "slow"
slow-timeout = { period = "10s", terminate-after = 2 }

[profile.ci]
inherits = "default"
fail-fast = false
junit = { path = "junit.xml" }

[test-groups.fast]
max-threads = 2

[test-groups.persistence-provider]
max-threads = 1

[test-groups.engine-smoke]
max-threads = 1

[test-groups.process]
max-threads = 1

[test-groups.real-network]
max-threads = 1

[test-groups.device]
max-threads = 1

# 以下两组测试在进程内用 ENGINE_TEST_LOCK 串行启动完整 Engine；nextest 每个测试一个进程，进程内锁失效，
# 由测试组恢复同样的串行约束。
[test-groups.engine-host-contract]
max-threads = 1

[test-groups.binding-contract]
max-threads = 1

# 成员多节点真实场景每项启动 2–10 个完整 Engine，单项常超过 20 秒；限制并发避免负载放大时序误差。
[test-groups.membership-e2e]
max-threads = 4

# 拓扑类场景每项 4–10 个 Engine，单独限制并发，避免与其他重场景叠加放大时序误差。
[test-groups.membership-topology]
max-threads = 2

# 升级兼容矩阵：每个单元启动 1–2 个完整 Engine 宿主进程；并发按本机核数保守限制。
[test-groups.upgrade-matrix]
max-threads = 4

[[profile.default.overrides]]
filter = "package(uc-testkit)"
test-group = "fast"
slow-timeout = { period = "2s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(uc-application) & (test(admission_recovery_scenarios) | test(device_trust_recovery_scenario) | test(legacy_candidate_convergence_scenario) | test(virtual_membership_network) | test(file_transfer_completion_scenario_reports_final_state) | test(text_transfer_scenario))"
test-group = "fast"
slow-timeout = { period = "2s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(uc-infra-p2p) & test(provider_dependency_evidence)"
test-group = "persistence-provider"
slow-timeout = { period = "5s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(uc-infra-profile) & binary(profile_storage_upgrade_crash)"
test-group = "process"
slow-timeout = { period = "20s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = "package(uc-testkit)"
test-group = "fast"
slow-timeout = { period = "2s", terminate-after = 1 }


# 编译期字段目录 UI 测试在测试内用 trybuild 另建一个工程并编译全部失败样例；冷缓存的 CI 上单项超过 20 秒，
# 不是卡死。期限需覆盖冷编译，测试本身仍然运行并逐条比对编译器输出。
[[profile.default.overrides]]
filter = "package(uc-observability-contract) & binary(log_event_ui)"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = "package(uc-observability-contract) & binary(log_event_ui)"
slow-timeout = { period = "60s", terminate-after = 5 }

# 完整恢复矩阵在子进程中连续重启 Engine；期限覆盖场景自身的 180 秒预算。
[[profile.default.overrides]]
filter = "package(uc-engine) & binary(host_contract) & test(clipboard_startup_recovery_process)"
test-group = "process"
slow-timeout = { period = "60s", terminate-after = 4 }


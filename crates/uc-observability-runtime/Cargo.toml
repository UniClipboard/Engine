[package]
name = "uc-observability-runtime"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Process-owned OpenTelemetry and local diagnostic runtime"
publish = false

[dependencies]
chrono = "0.4"
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry-appender-tracing = { version = "=0.32.0", default-features = false }
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry", "std"] }
uc-observability-contract = { path = "../uc-observability-contract" }
url = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }
zeroize = "1.8"

[target.'cfg(target_os = "android")'.dependencies]
jni22 = { package = "jni", version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"
tracing-android = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
tracing-oslog = "0.3"

[dev-dependencies]
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace", "logs", "testing"] }
prost = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"

[lints]
workspace = true

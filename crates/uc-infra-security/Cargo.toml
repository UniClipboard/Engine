[package]
name = "uc-infra-security"
version.workspace = true
license.workspace = true
edition = "2021"
description = "The single runtime security session, profile key vault and content-protection context for UniClipboard infra"
publish = false

[features]
default = []
test-util = ["uc-infra-crypto/test-util"]

[dependencies]
uc-core = { path = "../uc-core" }
uc-application = { path = "../uc-application" }
uc-infra-crypto = { path = "../uc-infra-crypto" }
uc-infra-local = { path = "../uc-infra-local" }
uc-observability-contract = { path = "../uc-observability-contract" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1", features = [
  "sync",
  "fs",
  "rt-multi-thread",
  "macros",
  "time",
  "io-util",
] }
tracing = "0.1"
rand = "0.9.2"
zeroize = { version = "1.8.2", features = ["derive"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4.3"
blake3 = "1.8.2"
postcard = { version = "1", features = ["use-std"] }

[dependencies.uuid]
version = "1.10.0"
features = ["v4"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
uc-testkit = { path = "../../tests/uc-testkit" }
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
mockall = "0.13"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

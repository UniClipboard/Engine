[package]
name = "uc-infra-profile"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Profile storage upgrade, backup/recovery, and Space admission activation for UniClipboard"
publish = false

[features]
default = []
# Allows test harnesses to bind sponsor and joiner endpoints in one process.
# Production builds must not enable it: the runtime lease must reject a second
# live node. See src/network/iroh/node.rs for the production lifecycle guard.
test-util = [
  "dep:tempfile",
  "uc-infra-security/test-util",
  "uc-infra-content/test-util",
  "uc-infra-p2p/test-util",
]

[dependencies]
# ===== Workspace crates =====
uc-core = { path = "../uc-core" }
uc-application = { path = "../uc-application" }
uc-infra-local = { path = "../uc-infra-local" }
uc-infra-crypto = { path = "../uc-infra-crypto" }
uc-infra-security = { path = "../uc-infra-security" }
uc-infra-storage = { path = "../uc-infra-storage" }
uc-infra-content = { path = "../uc-infra-content" }
uc-infra-p2p = { path = "../uc-infra-p2p" }
# Portable panic-visible supervision for detached tasks that have no natural
# handle owner (for example, the pairing receive pump).
uc-observability-contract = { path = "../uc-observability-contract" }
# Transport-independent wire codecs shared by the iroh adapters.
uc-sync-protocol = { path = "../uc-sync-protocol" }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# ===== 数据库 =====
diesel = { version = "2.3.5", features = [
  "sqlite",
  "returning_clauses_for_sqlite_3_35",
  "r2d2",
] } # ORM数据库框架
# build libsqlite3 as part of the build process
# uncomment this line if you run into setup issues
libsqlite3-sys = { version = "0.35", features = ["bundled"] }    # SQLite系统库绑定
diesel_migrations = { version = "2.2.0", features = ["sqlite"] } # Diesel迁移工具

# Async runtime (for mpsc channels in ports)
tokio = { version = "1", features = [
  "sync",
  "fs",
  "rt-multi-thread",
  "macros",
  "time",
  "io-util",
] }

tracing = "0.1"
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
argon2 = { version = "0.5.3", features = ["std"] }
opaque-ke = { version = "=4.0.1", features = ["argon2", "ristretto255"] }
base64 = "0.22"
subtle = "2.5.0"
chacha20poly1305 = { version = "0.10.1", features = ["std", "stream"] }
rand = "0.9.2"
# opaque-ke 4.0.1 takes RNG handles from rand 0.8 and declares it with
# default-features = false, so `OsRng` only exists when some crate in the graph
# enables its `getrandom` feature. That used to happen by accident through
# openmls_rust_crypto 0.5 / openmls_basic_credential 0.5; the 0.6 releases
# dropped rand 0.8 entirely. Declare the requirement here instead of relying on
# feature unification from an unrelated dependency.
rand_opaque = { package = "rand", version = "0.8", default-features = false, features = ["getrandom"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
# Memory hygiene: zero out MasterKey / Kek bytes when dropped so residual key
# material does not linger in heap/stack pages after lock/clear/refresh paths.
zeroize = { version = "1.8.2", features = ["derive"] }
openmls = { version = "=0.9.0", features = ["fork-resolution"] }
openmls_basic_credential = "=0.6.0"
openmls_memory_storage = { version = "=0.6.0", features = ["test-utils"] }
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
blake3 = "1.8.2"
hex = "0.4.3"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
base32 = "0.5"
unicode-normalization = "0.1"
unicode-segmentation = "1"
url = "2"
zstd = { version = "0.13", features = ["zstdmt"] }
# SpoolManager 用 IndexMap 维护 insertion-ordered 条目，做 O(1) 容量计数 +
# FIFO eviction。需要稳定的迭代顺序来表达 "evict 最旧未完成 staged" 语义，
# 普通 HashMap 做不到。
indexmap = "2"

# EndpointAddr/EndpointId types surface through a handful of uc-infra-profile
# admission call sites that consume uc-infra-p2p's decoded continuation routes.
iroh = { version = "1.3.0" }
# Slice 1 pairing session wire codec — binary, compact, serde-compatible.
postcard = { version = "1", features = ["use-std"] }
# Slice 2 Phase 2 clipboard wire codec — carry zero-copy ciphertext across
# the stream/facade boundary without extra clones. Same crate uc-core already
# pulls in on its own port contracts.
bytes = "1.7"
# Config-migration bundle: pack/unpack the plaintext archive that gets sealed
# inside a `.ucbundle`. Plain (uncompressed) tar — no compression layer, so the
# AEAD ciphertext does not leak archive structure through compression ratios.
tar = "0.4"
tempfile = { version = "3", optional = true }

[dependencies.uuid]
version = "1.10.0"
features = ["v4"]

# No-replace publication primitives: renameat2(RENAME_NOREPLACE) on Linux and
# renamex_np(RENAME_EXCL) on macOS. std::fs::rename replaces silently, so the
# raw syscalls are the only way to get "fail if the destination exists".
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Same guarantee via MoveFileExW without MOVEFILE_REPLACE_EXISTING.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
uc-infra-security = { path = "../uc-infra-security", features = ["test-util"] }
uc-infra-storage = { path = "../uc-infra-storage", features = ["test-util"] }
uc-infra-content = { path = "../uc-infra-content", features = ["test-util"] }
uc-infra-p2p = { path = "../uc-infra-p2p", features = ["test-util"] }
uc-observability-runtime = { path = "../uc-observability-runtime" }
uc-testkit = { path = "../../tests/uc-testkit" }
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
static_assertions = "1"
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace", "logs"] }
opentelemetry-appender-tracing = { version = "=0.32.0", default-features = false }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace", "logs", "testing"] }

[[bench]]
name = "admission_repository"
harness = false
required-features = ["test-util"]

[lints]
workspace = true

[package]
name = "uc-engine"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Stable cross-platform engine interface for UniClipboard hosts"
publish = false

[features]
default = []
dev-tools = ["dep:tracing-subscriber"]
lan-compat = [
  "dep:uc-mobile-lan",
  "dep:uc-mobile-proto",
  "uc-application/lan-compat",
  "uc-infra/lan-compat",
]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
thiserror = "2.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
url = "2"
uc-application = { path = "../uc-application" }
uc-core = { path = "../uc-core", features = ["task-registry"] }
uc-infra = { path = "../uc-infra" }
uc-mobile-lan = { path = "../../compatibility/uc-mobile-lan", optional = true }
uc-mobile-proto = { path = "../../compatibility/uc-mobile-proto", optional = true }
uc-observability-contract = { path = "../uc-observability-contract" }
uc-observability-runtime = { path = "../uc-observability-runtime" }
zeroize = "1.8"

[dev-dependencies]
cargo_metadata = "0.19.2"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3.5", features = ["sqlite"] }
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
prost = "0.14"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
uc-infra = { path = "../uc-infra", features = ["test-util"] }
wiremock = "0.6"

[lints]
workspace = true

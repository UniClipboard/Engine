[package]
name = "uc-infra-crypto"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Database/network/session-free cryptographic algorithms and formats for UniClipboard infra"
publish = false

[dependencies]
uc-core = { path = "../uc-core" }

serde = { version = "1", features = ["derive", "rc"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"

argon2 = { version = "0.5.3", features = ["std"] }
chacha20poly1305 = { version = "0.10.1", features = ["std", "stream"] }
rand = "0.9.2"
zeroize = { version = "1.8.2", features = ["derive"] }
blake3 = "1.8.2"
sha2 = "0.10"
base32 = "0.5"

[lints]
workspace = true

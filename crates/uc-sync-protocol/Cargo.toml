[package]
name = "uc-sync-protocol"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Transport-independent wire codecs and limits for the UniClipboard sync protocol"
publish = false

[dependencies]
uc-core = { path = "../uc-core" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
bytes = "1.7"
anyhow = "1.0"
thiserror = "2.0"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "time"] }
uuid = "1.10.0"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "time", "rt", "macros"] }

[lints]
workspace = true
